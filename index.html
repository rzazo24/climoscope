<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>climoscope</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%A4%EF%B8%8F</text></svg>">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://picsum.photos">
<link rel="preconnect" href="https://fastly.picsum.photos">
<link rel="preconnect" href="https://robohash.org">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="photo-layer" id="photoLayer"></div>
<div class="stars-layer" id="starsLayer"></div>
<div class="menu-backdrop" id="menuBackdrop"></div>

<div class="app">
  <div class="masthead">
    <div class="brand-row">
      <div class="brand">climo<span>scope</span></div>
      <img id="robotAvatar" class="robot-avatar" alt="" width="28" height="28">
    </div>
    <div class="clock" id="clockNow">--:--</div>
  </div>

  <div class="search-wrap">
    <div class="search-row">
      <input id="cityInput" type="text" placeholder="Search city..." autocomplete="off">
      <button id="favoritesBtn" class="toggle-btn" aria-label="Favorites" aria-expanded="false">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      </button>
      <button id="geoBtn" class="toggle-btn" aria-label="Use my location">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/></svg>
      </button>
      <button id="unitToggle" class="toggle-btn" aria-label="Switch temperature unit" aria-pressed="false">°C</button>
      <button id="langToggle" class="toggle-btn" aria-label="Switch language" aria-pressed="false">EN</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
    <div class="suggestions" id="favoritesMenu"></div>
  </div>

  <div class="panel" id="mainPanel">
    <div class="status-line">Search a city to start</div>
  </div>

  <div class="panel" id="hourlyPanel" style="display:none;">
    <div class="section-title">Next hours</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="panel" id="dailyPanel" style="display:none;">
    <div class="section-title">7 days</div>
    <div class="daily-list" id="dailyList"></div>
  </div>

  <footer>
    <div id="footerText">Data from Open-Meteo & OpenStreetMap</div>
    <div class="credit">Made with ❤️ by <a href="https://github.com/rzazo24" target="_blank" rel="noopener noreferrer">rzazo24</a></div>
    <div class="version"><a href="https://github.com/rzazo24/climoscope/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">v1.4.4</a></div>
  </footer>
</div>

<div class="update-banner" id="updateBanner" style="display:none;">
  <span id="updateBannerText">New version available</span>
  <button id="updateBannerBtn">Reload</button>
</div>

<div class="detail-modal" id="aqiModal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="aqiModalTitle">
  <div class="detail-modal-content">
    <div class="detail-modal-header">
      <span id="aqiModalTitle">Air quality</span>
      <button class="detail-modal-close" id="aqiModalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <div id="aqiModalBody"></div>
  </div>
</div>

<div class="detail-modal" id="precipModal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="precipModalTitle">
  <div class="detail-modal-content">
    <div class="detail-modal-header">
      <span id="precipModalTitle">Precipitation</span>
      <button class="detail-modal-close" id="precipModalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <div id="precipModalBody"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
