<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>climoscope</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <div class="masthead">
    <div class="brand">climo<span>scope</span></div>
    <div class="clock" id="clockNow">--:--</div>
  </div>

  <div class="search-wrap">
    <div class="search-row">
      <input id="cityInput" type="text" placeholder="Buscar ciudad..." autocomplete="off">
      <button id="unitToggle">°C</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="recent-row" id="recentRow"></div>

  <div class="panel" id="mainPanel">
    <div class="status-line">Busca una ciudad para empezar</div>
  </div>

  <div class="panel" id="hourlyPanel" style="display:none;">
    <div class="section-title">Próximas horas</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="panel" id="dailyPanel" style="display:none;">
    <div class="section-title">7 días</div>
    <div class="daily-list" id="dailyList"></div>
  </div>

  <footer>Datos de Open-Meteo · sin registro, sin clave de API</footer>
</div>

<script src="js/app.js"></script>

</body>
</html>
