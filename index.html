<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>climoscope</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <div class="masthead">
    <div class="brand">climo<span>scope</span></div>
    <div class="clock" id="clockNow">--:--</div>
  </div>

  <div class="search-wrap">
    <div class="search-row">
      <input id="cityInput" type="text" placeholder="Search city..." autocomplete="off">
      <button id="unitToggle" class="toggle-btn">°C</button>
      <button id="langToggle" class="toggle-btn" aria-label="Switch language">EN</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="recent-row" id="recentRow"></div>

  <div class="panel" id="mainPanel">
    <div class="status-line">Search a city to start</div>
  </div>

  <div class="panel" id="hourlyPanel" style="display:none;">
    <div class="section-title">Next hours</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="panel" id="dailyPanel" style="display:none;">
    <div class="section-title">7 days</div>
    <div class="daily-list" id="dailyList"></div>
  </div>

  <footer>Data from Open-Meteo · no sign-up, no API key</footer>
</div>

<script src="js/app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
